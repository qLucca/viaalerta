name: Publicar web na Azure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "infra/deploy-app.sh", ".github/workflows/web.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_ENV: ${{ vars.AZURE_CONTAINER_ENV }}
      AZURE_REGISTRY: ${{ vars.AZURE_REGISTRY }}
      AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
      AZURE_PULL_IDENTITY: ${{ vars.AZURE_PULL_IDENTITY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_DETECTION_API_URL: ${{ vars.DETECTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir, publicar e verificar
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?}" "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?}" "${NEXT_PUBLIC_DETECTION_API_URL:?}"
          node -e 'const url = new URL(process.env.NEXT_PUBLIC_DETECTION_API_URL); if (url.protocol !== "https:" || url.pathname !== "/detect") throw new Error("Configure a API HTTPS com o caminho /detect.")'
          az extension add --name containerapp --upgrade --only-show-errors
          az acr login --name "$AZURE_REGISTRY"
          image="$AZURE_REGISTRY_SERVER/viaalerta-web:$GITHUB_SHA"
          docker build --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --build-arg NEXT_PUBLIC_DETECTION_API_URL -t "$image" web
          docker push "$image"
          bash infra/deploy-app.sh web "$image"
