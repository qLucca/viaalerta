name: Verificar projeto
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: mobile
      - run: npm test && npm run typecheck && npm run lint
        working-directory: web
      - run: npm test && npm run typecheck
        working-directory: mobile
      - name: Testar HTTP sem instalar pesos ou iniciar treinamento
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          dependencies = [line.strip() for line in Path('api/requirements.txt').read_text().splitlines()
                          if line.strip() and not line.startswith(('#', 'ultralytics'))]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *dependencies])
          PY
          python api/tests/test_api.py
