name: Publicar API com modelo treinado
on:
  workflow_dispatch:
    inputs:
      model_release:
        description: Tag da Release privada que contém best.pt e SHA256SUMS.txt
        required: true
        default: modelo-v1
        type: string
      diagnose_only:
        description: Consultar estado e logs da API existente, sem publicar
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_ENV: ${{ vars.AZURE_CONTAINER_ENV }}
      AZURE_REGISTRY: ${{ vars.AZURE_REGISTRY }}
      AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
      AZURE_PULL_IDENTITY: ${{ vars.AZURE_PULL_IDENTITY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      CORS_ORIGINS: ${{ vars.WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir configuração antes de publicar
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Conclua a configuração OIDC na Azure}"
          : "${AZURE_TENANT_ID:?Conclua a configuração OIDC na Azure}"
          : "${AZURE_SUBSCRIPTION_ID:?}" "${SUPABASE_URL:?}" "${SUPABASE_PUBLISHABLE_KEY:?}"
          : "${AZURE_RESOURCE_GROUP:?}" "${AZURE_CONTAINER_ENV:?}" "${AZURE_REGISTRY:?}" "${AZURE_REGISTRY_SERVER:?}" "${AZURE_PULL_IDENTITY:?}" "${CORS_ORIGINS:?}"
      - name: Obter o checkpoint escolhido, sem treinar
        if: ${{ !inputs.diagnose_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE: ${{ inputs.model_release }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$MODEL_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern best.pt --pattern SHA256SUMS.txt --dir api/models
          cd api/models
          [[ -s best.pt ]]
          # Valida apenas a entrada best.pt, sem aceitar caminhos adicionais do manifesto.
          expected=$(awk '$2 == "best.pt" {print $1}' SHA256SUMS.txt)
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  best.pt\n' "$expected" | sha256sum --check --strict
          echo "MODEL_SHA256=${expected,,}" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir, publicar e verificar
        if: ${{ !inputs.diagnose_only }}
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az acr login --name "$AZURE_REGISTRY"
          image="$AZURE_REGISTRY_SERVER/viaalerta-api:$GITHUB_SHA-$GITHUB_RUN_ID"
          docker build --build-arg MODEL_SHA256="$MODEL_SHA256" -t "$image" api
          docker push "$image"
          bash infra/deploy-app.sh api "$image"
      - name: Consultar estado e logs da API
        if: ${{ failure() || inputs.diagnose_only }}
        shell: bash
        run: |
          set -u
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp show -n viaalerta-api -g "$AZURE_RESOURCE_GROUP" --query '{state:properties.provisioningState,error:properties.provisioningError,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,host:properties.configuration.ingress.fqdn}' -o json
          az containerapp revision list -n viaalerta-api -g "$AZURE_RESOURCE_GROUP" --query '[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,details:properties.runningStateDetails,error:properties.provisioningError,image:properties.template.containers[0].image}' -o json
          timeout 60 az containerapp logs show -n viaalerta-api -g "$AZURE_RESOURCE_GROUP" --type system --tail 60 --format json || true
          timeout 60 az containerapp logs show -n viaalerta-api -g "$AZURE_RESOURCE_GROUP" --type console --container api --tail 60 --format text || true
